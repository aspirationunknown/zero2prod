[package]
name = "zero2prod"
version = "0.1.0"
authors = ["Charlie Parsons <prisonofidentity@gmail.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = "0.13.4"
