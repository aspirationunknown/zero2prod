name: zero2prod

region: ric1

services:
    - name: zero2prod
      dockerfile_path: Dockerfile
      source_dir: .
      github:
          branch: main
          deploy_on_push: true
          repo: aspirationunknown/zero2prod
      health_check:
          http_path: /health_check
      http_port: 8078
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      routes:
          - path: /
databases:
    # PG = Postgres
    - engine: PG
      # Database name
      name: newsletter
      num_nodes: 1
      size: db-s-dev-database
      version: "18"
